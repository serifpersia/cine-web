<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamVault</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.5;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            background: linear-gradient(to right, #60a5fa, #2563eb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Search Section */
        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 3rem;
            background: var(--card-bg);
            padding: 8px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        #search-input {
            flex-grow: 1;
            padding: 12px 16px;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }

        #search-button {
            padding: 10px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }

        #search-button:hover {
            background: var(--primary-hover);
        }

        /* Player Section */
        #player-container {
            display: none;
            margin-bottom: 3rem;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border);
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .close-player {
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transition: background 0.2s;
        }

        .close-player:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.2);
            padding: 15px;
            border-radius: 10px;
        }

        .controls label {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .controls input, .controls select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
            outline: none;
        }

        .controls input[type="number"] { width: 70px; }

        #video-frame {
            width: 100%;
            aspect-ratio: 16/9;
            border: none;
            background: #000;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        }

        /* Results Grid */
        .results {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 25px;
        }

        .result-item {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid var(--border);
        }

        .result-item:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .result-item img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-bottom: 1px solid var(--border);
        }

        .result-content {
            padding: 15px;
        }

        .result-item h3 {
            font-size: 0.95rem;
            margin: 0 0 8px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .result-item p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0;
            display: flex;
            justify-content: space-between;
        }

        .type-badge {
            background: rgba(37, 99, 235, 0.2);
            color: #60a5fa;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-size: 0.7rem;
            font-weight: 700;
        }

        #status-msg {
            text-align: center;
            color: var(--text-muted);
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>StreamVault</h1>
    
    <div id="player-container">
        <div class="player-header">
            <h2 id="current-title" style="margin:0">Watching...</h2>
            <span class="close-player" onclick="closePlayer()">✕</span>
        </div>
        <div class="controls">
            <label>Source: 
                <select id="source-select" onchange="updatePlayer()">
                    <option value="vidsrcto">VidSrc.to</option>
                    <option value="hnembed">HNEmbed</option>
                    <option value="vidapi">VidAPI</option>
                </select>
            </label>
            <label id="season-label">Season: <input type="number" id="season-input" value="1" min="1" onchange="updatePlayer()"></label>
            <label id="episode-label">Episode: <input type="number" id="episode-input" value="1" min="1" onchange="updatePlayer()"></label>
            <button id="refresh-player" onclick="updatePlayer()">Refresh Player</button>
        </div>
        <iframe id="video-frame" allowfullscreen allow="autoplay; fullscreen"></iframe>
    </div>

    <div class="search-container">
        <input type="text" id="search-input" placeholder="Enter movie or show name...">
        <button id="search-button">Search</button>
    </div>

    <div id="status-msg"></div>
    <div id="results-list" class="results"></div>

    <script>
        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const resultsList = document.getElementById('results-list');
        const statusMsg = document.getElementById('status-msg');
        const playerContainer = document.getElementById('player-container');
        const videoFrame = document.getElementById('video-frame');
        
        let currentItem = null;

        function closePlayer() {
            playerContainer.style.display = 'none';
            videoFrame.src = '';
        }

        function openPlayer(item) {
            currentItem = item;
            playerContainer.style.display = 'block';
            document.getElementById('current-title').innerText = item.title;
            document.getElementById('season-input').value = item.season || 1;
            document.getElementById('episode-input').value = 1;
            
            if (item.type === 'movie') {
                document.getElementById('season-label').style.display = 'none';
                document.getElementById('episode-label').style.display = 'none';
            } else {
                document.getElementById('season-label').style.display = 'inline-flex';
                document.getElementById('episode-label').style.display = 'inline-flex';
            }
            
            updatePlayer();
            playerContainer.scrollIntoView({ behavior: 'smooth' });
        }

        function updatePlayer() {
            if (!currentItem) return;
            const season = document.getElementById('season-input').value;
            const episode = document.getElementById('episode-input').value;
            const source = document.getElementById('source-select').value;
            const imdbId = currentItem.id;
            
            let url = '';
            const isMovie = currentItem.type === 'movie';

            switch(source) {
                case 'vidsrcto': 
                    url = `https://vidsrc.to/embed/${isMovie ? 'movie' : 'tv'}/${imdbId}${isMovie ? '' : `/${season}/${episode}`}`; 
                    break;
                case 'hnembed': 
                    url = `https://hnembed.cc/embed/${isMovie ? 'movie' : 'tv'}/${imdbId}${isMovie ? '' : `/${season}/${episode}`}`; 
                    break;
                case 'vidapi': 
                    url = `https://vaplayer.ru/embed/${isMovie ? 'movie' : 'tv'}/${imdbId}${isMovie ? '' : `/${season}/${episode}`}`; 
                    break;
            }

            videoFrame.src = url;
        }

        async function doSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            statusMsg.innerText = 'Searching for your title...';
            resultsList.innerHTML = '';
            
            try {
                const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                
                statusMsg.innerText = '';
                if (data.length === 0) {
                    statusMsg.innerText = 'No results found. Try a different title.';
                    return;
                }

                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'result-item';
                    div.onclick = () => openPlayer(item);
                    div.innerHTML = `
                        <img src="${item.image || 'https://via.placeholder.com/180x260?text=No+Poster'}" alt="${item.title}" loading="lazy">
                        <div class="result-content">
                            <h3>${item.title}</h3>
                            <p>
                                <span>${item.year || 'N/A'}</span>
                                <span class="type-badge">${item.type === 'tvSeries' ? 'TV' : 'Movie'}</span>
                            </p>
                        </div>
                    `;
                    resultsList.appendChild(div);
                });
            } catch (error) {
                console.error('Search failed:', error);
                statusMsg.innerText = 'Search failed. Check your connection.';
            }
        }

        searchButton.addEventListener('click', doSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') doSearch();
        });
    </script>
</body>
</html>
